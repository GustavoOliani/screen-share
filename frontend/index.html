<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="pages/login/login.css">
    <title>Bar'do Aventureiro - Bilheteria</title>
</head>
<body>
    <main id="login-screen">
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="room-password">Senha da Sala:</label>
                <input type="password" id="room-password" placeholder="Digite a senha" required>
            </div>
            <button type="submit">Entrar na Sala</button>
        </form>
        <div id="status-msg" role="status" aria-live="polite"></div>
    </main>

    <script src="common/config.js"></script>
    <script src="pages/login/login.js" defer></script>
</body>
</html>
