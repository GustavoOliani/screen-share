<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="pages/room/room.css">
    <title>Sala - Screen Share P2P</title>
    
</head>
<body>
    <main id="room-screen">
        <header id="room-header">
            <h1>Salão de shows do Bar'do Aventureiro</h1>
            <section>
                <span id="user-id-display"></span>
                <span id="participants-heading">Na sala (0)</span>
            </section>
            <span id="connection-status" role="status" aria-live="polite">Conectando ao servidor...</span>
        </header>
        <div id="video-content">
            <div id="main-video-container" aria-live="polite">
                <div id="placeholder-card" class="placeholder-message">Aguardando compartilhamento de tela...</div>
            </div>
            <div id="thumbnail-strip" aria-label="Outros compartilhamentos"></div>
        </div>
        <footer>
            <section id="share-settings" aria-label="Configurações de compartilhamento">
                <label for="resolution-select">
                    Resolução
                    <select id="resolution-select">
                        <option value="1280x720">720p</option>
                        <option value="1920x1080" selected>1080p</option>
                        <option value="2560x1440">1440p</option>
                    </select>
                </label>
                <label for="frame-rate-select">
                    FPS
                    <select id="frame-rate-select">
                        <option value="15">15</option>
                        <option value="30" selected>30</option>
                        <option value="60">60</option>
                    </select>
                </label>
                <span id="codec-status" role="status" aria-live="polite">Codec: aguardando conexão de vídeo</span>
                <small>O navegador pode ajustar a qualidade conforme a tela e o dispositivo.</small>
            </section>
            <div id="footer-actions">
                <button id="share-btn" class="btn-success" disabled>Compartilhar Tela</button>
                <button class="btn-danger">Sair da Sala</button>
            </div>
        </footer>
    </main>


    <script src="common/config.js"></script>
    <script src="pages/room/room-service.js" defer></script>
    <script src="pages/room/webrtc-service.js" defer></script>
    <script src="pages/room/room.js" defer></script>
</body>
</html>
